<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Studio Deck System Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'gs-primary': '#C40F4C',
        'gs-primary-mid': '#E8175D',
        'gs-accent': '#4F31D9',
        'gs-deep': '#0A1026',
        'gs-support-1': '#D18A00',
        'gs-support-2': '#00A3AE',
        'gs-ink': '#0A1026',
        'gs-body': '#1B2347',
        'gs-muted': '#5B6486',
        'gs-muted-soft': '#9AA1BE',
        'gs-rule': '#D9DCEA',
        'gs-tint': '#EDEFF7',
        'gs-surface': '#F6F7FB',
        'gs-white': '#ffffff',
        'gs-viz-rose': '#E8175D',
        'gs-viz-amber': '#FFB000',
        'gs-viz-cyan': '#00D3E0',
        'gs-viz-violet': '#6B4DFF',
        'gs-viz-lime': '#B6F02E',
        'gs-viz-green': '#12B76A',
        'gs-viz-rose-soft': '#FF7FA6',
      },

      fontFamily: {
        gs: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'gs-display': ['132px', { lineHeight: '0.95', fontWeight: '800' }],
        'gs-section': ['132px', { lineHeight: '1.0', fontWeight: '700' }],
        'gs-title': ['84px', { lineHeight: '1.05', fontWeight: '700' }],
        'gs-h2': ['44px', { lineHeight: '1.15', fontWeight: '600' }],
        'gs-h3': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-metric': ['132px', { lineHeight: '1.0', fontWeight: '800' }],
        'gs-lead': ['28px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-subhead': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-body-sm': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-label': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-eyebrow': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-caption': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
      },

      letterSpacing: {
        'gs-eyebrow': '0.14em',
        'gs-label': '0.08em',
      },

      borderRadius: {
        'gs-sm': '6px',
        'gs-md': '10px',
        'gs-lg': '16px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1920px; height:1080px; position:relative; overflow:hidden;
    font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
</style>
</head>
<body>

<div id="slide" data-template="01-title" class="bg-gs-deep">

  <div class="absolute left-0 top-0 right-0 h-[10px] bg-gs-primary-mid"></div>

  <div class="absolute left-[96px] top-[400px] text-gs-eyebrow text-gs-support-1 uppercase tracking-gs-eyebrow"
       style="font-family:'IBM Plex Mono',ui-monospace,monospace;">Publisher pitch</div>

  <div class="absolute left-[96px] top-[444px] w-[1500px]">
    <h1 class="font-gs font-extrabold text-gs-display text-gs-white">Driftbreak</h1>
  </div>

  <div class="absolute left-[96px] top-[624px] w-[1150px]">
    <p class="text-gs-lead text-gs-muted-soft" style="font-family:'IBM Plex Sans',system-ui,sans-serif;">A run-based salvage roguelite for PC and Switch.</p>
  </div>

  <div class="absolute left-[96px] top-[708px] flex items-center gap-[16px]">
    <span class="inline-flex items-center gap-[8px] h-[40px] px-[16px] rounded-gs-sm border border-gs-muted text-gs-caption text-gs-white"
          style="font-family:'IBM Plex Mono',ui-monospace,monospace;">
      <span class="inline-block w-[7px] h-[7px] rounded-[2px] bg-gs-viz-cyan"></span>Roguelite
    </span>
    <span class="inline-flex items-center gap-[8px] h-[40px] px-[16px] rounded-gs-sm border border-gs-muted text-gs-caption text-gs-white"
          style="font-family:'IBM Plex Mono',ui-monospace,monospace;">
      <span class="inline-block w-[7px] h-[7px] rounded-[2px] bg-gs-viz-amber"></span>PC &middot; Switch
    </span>
    <span class="inline-flex items-center gap-[8px] h-[40px] px-[16px] rounded-gs-sm border border-gs-muted text-gs-caption text-gs-white"
          style="font-family:'IBM Plex Mono',ui-monospace,monospace;">
      <span class="inline-block w-[7px] h-[7px] rounded-[2px] bg-gs-viz-lime"></span>Q4 2027
    </span>
  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[20px] text-gs-muted font-gs">
    <span></span>
    <span class="font-bold text-gs-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1920×1080 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1920, window.innerHeight/1080);
      s.style.width='1920px';
      s.style.height='1080px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
