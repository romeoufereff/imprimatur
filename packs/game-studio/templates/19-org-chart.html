<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Studio Deck System Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'gs-primary': '#C40F4C',
        'gs-primary-mid': '#E8175D',
        'gs-accent': '#4F31D9',
        'gs-deep': '#0A1026',
        'gs-support-1': '#D18A00',
        'gs-support-2': '#00A3AE',
        'gs-ink': '#0A1026',
        'gs-body': '#1B2347',
        'gs-muted': '#5B6486',
        'gs-muted-soft': '#9AA1BE',
        'gs-rule': '#D9DCEA',
        'gs-tint': '#EDEFF7',
        'gs-surface': '#F6F7FB',
        'gs-white': '#ffffff',
        'gs-viz-rose': '#E8175D',
        'gs-viz-amber': '#FFB000',
        'gs-viz-cyan': '#00D3E0',
        'gs-viz-violet': '#6B4DFF',
        'gs-viz-lime': '#B6F02E',
        'gs-viz-green': '#12B76A',
        'gs-viz-rose-soft': '#FF7FA6',
      },

      fontFamily: {
        gs: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'gs-display': ['132px', { lineHeight: '0.95', fontWeight: '800' }],
        'gs-section': ['132px', { lineHeight: '1.0', fontWeight: '700' }],
        'gs-title': ['84px', { lineHeight: '1.05', fontWeight: '700' }],
        'gs-h2': ['44px', { lineHeight: '1.15', fontWeight: '600' }],
        'gs-h3': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-metric': ['132px', { lineHeight: '1.0', fontWeight: '800' }],
        'gs-lead': ['28px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-subhead': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-body-sm': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-label': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-eyebrow': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-caption': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
      },

      letterSpacing: {
        'gs-eyebrow': '0.14em',
        'gs-label': '0.08em',
      },

      borderRadius: {
        'gs-sm': '6px',
        'gs-md': '10px',
        'gs-lg': '16px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1920px; height:1080px; position:relative; overflow:hidden;
    font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
</style>
</head>
<body>

<div id="slide" data-template="19-org-chart" class="bg-white">

  <div class="absolute left-0 top-0 right-0 h-[10px] bg-gs-viz-lime"></div>

  <div class="absolute left-[96px] top-[80px] flex flex-col gap-[16px]">
    <span class="text-gs-eyebrow text-gs-support-2 uppercase tracking-gs-eyebrow"
          style="font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:700;">06 &mdash; The team</span>
    <h1 class="font-gs font-bold text-gs-title text-gs-ink leading-none">Eight people, three disciplines</h1>
  </div>

  <!-- Connector geometry, computed not eyeballed: parent centre = canvas centre = 960.
       Three 400px-wide children with 134px gaps sit at left=226/760/1294, so their centres
       are 426 / 960 / 1494 — the middle child lands exactly under the parent by construction.
       Each 2px-wide vertical drop is therefore left:(centre-1)px; the rail is a horizontal bar
       whose own left/right edges ARE the outer two centres, needing no centring math. -->
  <div class="absolute left-[959px] top-[452px] w-[2px] h-[48px] bg-gs-rule"></div>
  <div class="absolute left-[426px] top-[500px] w-[1068px] h-[2px] bg-gs-rule"></div>
  <div class="absolute left-[425px] top-[500px] w-[2px] h-[48px] bg-gs-rule"></div>
  <div class="absolute left-[959px] top-[500px] w-[2px] h-[48px] bg-gs-rule"></div>
  <div class="absolute left-[1493px] top-[500px] w-[2px] h-[48px] bg-gs-rule"></div>

  <div class="absolute left-[760px] top-[380px] w-[400px]">
    <div class="rounded-gs-lg border-2 border-gs-ink bg-white flex flex-col items-center justify-center gap-[4px] h-[72px]">
      <span class="font-gs font-bold text-gs-body-sm text-gs-ink">Founder &amp; Creative Director</span>
    </div>
  </div>

  <div class="absolute left-[226px] top-[548px] w-[400px]">
    <div class="rounded-gs-lg border border-gs-rule bg-gs-surface flex flex-col items-center justify-center gap-[4px] h-[72px]">
      <span class="font-gs font-semibold text-gs-body-sm text-gs-ink">Design lead</span>
      <span class="text-gs-caption text-gs-muted" style="font-family:'IBM Plex Sans',system-ui,sans-serif;">2 systems designers</span>
    </div>
  </div>

  <div class="absolute left-[760px] top-[548px] w-[400px]">
    <div class="rounded-gs-lg border border-gs-rule bg-gs-surface flex flex-col items-center justify-center gap-[4px] h-[72px]">
      <span class="font-gs font-semibold text-gs-body-sm text-gs-ink">Engineering lead</span>
      <span class="text-gs-caption text-gs-muted" style="font-family:'IBM Plex Sans',system-ui,sans-serif;">3 engineers</span>
    </div>
  </div>

  <div class="absolute left-[1294px] top-[548px] w-[400px]">
    <div class="rounded-gs-lg border border-gs-rule bg-gs-surface flex flex-col items-center justify-center gap-[4px] h-[72px]">
      <span class="font-gs font-semibold text-gs-body-sm text-gs-ink">Art lead</span>
      <span class="text-gs-caption text-gs-muted" style="font-family:'IBM Plex Sans',system-ui,sans-serif;">1 artist, 1 contractor</span>
    </div>
  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[20px] text-gs-muted font-gs">
    <span></span>
    <span class="font-bold text-gs-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1920×1080 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1920, window.innerHeight/1080);
      s.style.width='1920px';
      s.style.height='1080px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
