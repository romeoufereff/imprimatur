<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Studio Deck System Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'gs-primary': '#C40F4C',
        'gs-primary-mid': '#E8175D',
        'gs-accent': '#4F31D9',
        'gs-deep': '#0A1026',
        'gs-support-1': '#D18A00',
        'gs-support-2': '#00A3AE',
        'gs-ink': '#0A1026',
        'gs-body': '#1B2347',
        'gs-muted': '#5B6486',
        'gs-muted-soft': '#9AA1BE',
        'gs-rule': '#D9DCEA',
        'gs-tint': '#EDEFF7',
        'gs-surface': '#F6F7FB',
        'gs-white': '#ffffff',
        'gs-viz-rose': '#E8175D',
        'gs-viz-amber': '#FFB000',
        'gs-viz-cyan': '#00D3E0',
        'gs-viz-violet': '#6B4DFF',
        'gs-viz-lime': '#B6F02E',
        'gs-viz-green': '#12B76A',
        'gs-viz-rose-soft': '#FF7FA6',
      },

      fontFamily: {
        gs: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'gs-display': ['132px', { lineHeight: '0.95', fontWeight: '800' }],
        'gs-section': ['132px', { lineHeight: '1.0', fontWeight: '700' }],
        'gs-title': ['84px', { lineHeight: '1.05', fontWeight: '700' }],
        'gs-h2': ['44px', { lineHeight: '1.15', fontWeight: '600' }],
        'gs-h3': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-metric': ['132px', { lineHeight: '1.0', fontWeight: '800' }],
        'gs-lead': ['28px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-subhead': ['38px', { lineHeight: '1.2', fontWeight: '600' }],
        'gs-body-sm': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
        'gs-label': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-eyebrow': ['20px', { lineHeight: '1.3', fontWeight: '600' }],
        'gs-caption': ['22px', { lineHeight: '1.45', fontWeight: '400' }],
      },

      letterSpacing: {
        'gs-eyebrow': '0.14em',
        'gs-label': '0.08em',
      },

      borderRadius: {
        'gs-sm': '6px',
        'gs-md': '10px',
        'gs-lg': '16px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1920px; height:1080px; position:relative; overflow:hidden;
    font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
</style>
</head>
<body>

<div id="slide" data-template="21-platforms" class="bg-gs-surface">

  <div class="absolute left-0 top-0 right-0 h-[10px] bg-gs-viz-cyan"></div>

  <div class="absolute left-[96px] top-[80px] flex flex-col gap-[16px]">
    <span class="text-gs-eyebrow text-gs-support-2 uppercase tracking-gs-eyebrow"
          style="font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:700;">05 &mdash; Roadmap</span>
    <h1 class="font-gs font-bold text-gs-title text-gs-ink leading-none">Where it ships</h1>
  </div>

  <div class="absolute left-[96px] top-[420px] flex gap-[32px]">

    <div class="w-[336px] rounded-gs-lg border-2 border-gs-primary bg-white flex flex-col items-center gap-[20px]" style="padding:40px 0;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-gs-primary" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
      <div class="flex flex-col items-center gap-[4px]">
        <span class="font-gs font-semibold text-gs-h3 text-gs-ink">PC</span>
        <span class="text-gs-caption text-gs-primary uppercase tracking-gs-label" style="font-family:'IBM Plex Mono',ui-monospace,monospace;">Launch</span>
      </div>
    </div>

    <div class="w-[336px] rounded-gs-lg border-2 border-gs-primary bg-white flex flex-col items-center gap-[20px]" style="padding:40px 0;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-gs-primary" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 17.5h.01"/></svg>
      <div class="flex flex-col items-center gap-[4px]">
        <span class="font-gs font-semibold text-gs-h3 text-gs-ink">Switch</span>
        <span class="text-gs-caption text-gs-primary uppercase tracking-gs-label" style="font-family:'IBM Plex Mono',ui-monospace,monospace;">Launch</span>
      </div>
    </div>

    <div class="w-[336px] rounded-gs-lg border border-gs-rule bg-white flex flex-col items-center gap-[20px]" style="padding:40px 0;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-gs-muted" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M15 10h3M15 14h3M17 9v6"/></svg>
      <div class="flex flex-col items-center gap-[4px]">
        <span class="font-gs font-semibold text-gs-h3 text-gs-ink">PlayStation</span>
        <span class="text-gs-caption text-gs-muted uppercase tracking-gs-label" style="font-family:'IBM Plex Mono',ui-monospace,monospace;">Post-launch</span>
      </div>
    </div>

    <div class="w-[336px] rounded-gs-lg border border-gs-rule bg-white flex flex-col items-center gap-[20px]" style="padding:40px 0;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-gs-muted" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="17" cy="12" r="2.4"/><path d="M6 9v6M9 12H3"/></svg>
      <div class="flex flex-col items-center gap-[4px]">
        <span class="font-gs font-semibold text-gs-h3 text-gs-ink">Xbox</span>
        <span class="text-gs-caption text-gs-muted uppercase tracking-gs-label" style="font-family:'IBM Plex Mono',ui-monospace,monospace;">Post-launch</span>
      </div>
    </div>

  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[20px] text-gs-muted font-gs">
    <span></span>
    <span class="font-bold text-gs-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1920×1080 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1920, window.innerHeight/1080);
      s.style.width='1920px';
      s.style.height='1080px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
