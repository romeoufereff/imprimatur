<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Slide Deck System (Outline) Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'out-primary': '#201e1d',
        'out-primary-mid': '#605d5d',
        'out-accent': '#ae1800',
        'out-deep': '#2d2b2b',
        'out-support-1': '#7d7979',
        'out-support-2': '#9b9797',
        'out-ink': '#201e1d',
        'out-body': '#444141',
        'out-muted': '#605d5d',
        'out-muted-soft': '#7d7979',
        'out-rule': '#d7d3d3',
        'out-tint': '#f8f4f4',
        'out-surface': '#eae9e9',
        'out-white': '#ffffff',
        'out-neutral-400': '#bab6b6',
        'out-accent-600': '#dd2b0f',
      },

      fontFamily: {
        out: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'out-display': ['72px', { lineHeight: '1.1', fontWeight: '700' }],
        'out-section': ['64px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-title': ['56px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-h2': ['40px', { lineHeight: '1.2', fontWeight: '700' }],
        'out-h3': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-metric': ['56px', { lineHeight: '1.0', fontWeight: '700' }],
        'out-lead': ['20px', { lineHeight: '1.6', fontWeight: '400' }],
        'out-subhead': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-body-sm': ['15px', { lineHeight: '1.55', fontWeight: '400' }],
        'out-label': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-eyebrow': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-caption': ['14px', { lineHeight: '1.4', fontWeight: '400' }],
      },

      letterSpacing: {
        'out-eyebrow': '0.08em',
        'out-label': '0.08em',
      },

      borderRadius: {
        'out-sm': '0px',
        'out-md': '0px',
        'out-lg': '0px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1280px; height:720px; position:relative; overflow:hidden; font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
  .gradient-text {
    background:linear-gradient(60deg, #201e1d 0%, #201e1d 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
</style>
</head>
<body>

<!-- Bars use the pack's own viz ramp (body → support-1 → neutral-400 → accent) rather than
     four decorative colours — the ruleNote is explicit that accent marks a single emphasised
     value, never a general-purpose fill, so only the largest share gets it. -->
<div id="slide" data-template="19-breakdown" class="bg-out-white">

  <div class="absolute left-[53px] top-[40px] text-out-eyebrow text-out-muted uppercase tracking-out-eyebrow">07 — The ask</div>
  <h2 class="absolute left-[53px] top-[83px] text-out-h2 text-out-ink">$3.5M to reach early access</h2>

  <div class="absolute left-[53px] top-[220px] w-[1147px] flex flex-col gap-[28px]">

    <div class="flex flex-col gap-[8px]">
      <div class="flex items-baseline justify-between text-out-body-sm text-out-body">
        <span>Engineering &amp; production</span>
        <span class="text-out-muted">45% &middot; $1.58M</span>
      </div>
      <div class="w-full h-[10px] bg-out-tint"><div class="h-full bg-out-accent" style="width:45%;"></div></div>
    </div>

    <div class="flex flex-col gap-[8px]">
      <div class="flex items-baseline justify-between text-out-body-sm text-out-body">
        <span>Art &amp; audio</span>
        <span class="text-out-muted">28% &middot; $0.98M</span>
      </div>
      <div class="w-full h-[10px] bg-out-tint"><div class="h-full bg-out-body" style="width:28%;"></div></div>
    </div>

    <div class="flex flex-col gap-[8px]">
      <div class="flex items-baseline justify-between text-out-body-sm text-out-body">
        <span>Marketing &amp; community</span>
        <span class="text-out-muted">17% &middot; $0.60M</span>
      </div>
      <div class="w-full h-[10px] bg-out-tint"><div class="h-full bg-out-support-1" style="width:17%;"></div></div>
    </div>

    <div class="flex flex-col gap-[8px]">
      <div class="flex items-baseline justify-between text-out-body-sm text-out-body">
        <span>Runway &amp; operations</span>
        <span class="text-out-muted">10% &middot; $0.35M</span>
      </div>
      <div class="w-full h-[10px] bg-out-tint"><div class="h-full bg-out-neutral-400" style="width:10%;"></div></div>
    </div>

  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[16px] text-out-muted font-out">
    <span>Confidential</span>
    <span class="font-bold text-out-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1280×720 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1280, window.innerHeight/720);
      s.style.width='1280px';
      s.style.height='720px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
