<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Slide Deck System (Outline) Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'out-primary': '#201e1d',
        'out-primary-mid': '#605d5d',
        'out-accent': '#ae1800',
        'out-deep': '#2d2b2b',
        'out-support-1': '#7d7979',
        'out-support-2': '#9b9797',
        'out-ink': '#201e1d',
        'out-body': '#444141',
        'out-muted': '#605d5d',
        'out-muted-soft': '#7d7979',
        'out-rule': '#d7d3d3',
        'out-tint': '#f8f4f4',
        'out-surface': '#eae9e9',
        'out-white': '#ffffff',
        'out-neutral-400': '#bab6b6',
        'out-accent-600': '#dd2b0f',
      },

      fontFamily: {
        out: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'out-display': ['72px', { lineHeight: '1.1', fontWeight: '700' }],
        'out-section': ['64px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-title': ['56px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-h2': ['40px', { lineHeight: '1.2', fontWeight: '700' }],
        'out-h3': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-metric': ['56px', { lineHeight: '1.0', fontWeight: '700' }],
        'out-lead': ['20px', { lineHeight: '1.6', fontWeight: '400' }],
        'out-subhead': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-body-sm': ['15px', { lineHeight: '1.55', fontWeight: '400' }],
        'out-label': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-eyebrow': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-caption': ['14px', { lineHeight: '1.4', fontWeight: '400' }],
      },

      letterSpacing: {
        'out-eyebrow': '0.08em',
        'out-label': '0.08em',
      },

      borderRadius: {
        'out-sm': '0px',
        'out-md': '0px',
        'out-lg': '0px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1280px; height:720px; position:relative; overflow:hidden; font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
  .gradient-text {
    background:linear-gradient(60deg, #201e1d 0%, #201e1d 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
</style>
</head>
<body>

<div id="slide" data-template="11-timeline" class="bg-out-white">

  <div class="absolute left-[53px] top-[40px] text-out-eyebrow text-out-muted uppercase tracking-out-eyebrow">05 — Topic name</div>
  <h2 class="absolute left-[53px] top-[83px] text-out-h2 text-out-ink">Path to launch</h2>

  <!-- Rule centre computed, not eyeballed: row top 330 + fixed date zone 38 + half the fixed
       24px tick zone (12) = 380, so a 2px rule at top:379 has its own centre at exactly 380 —
       matching regardless of date-label length (confirmed in-browser; see PROVENANCE.md). -->
  <div class="absolute left-[53px] top-[379px] w-[1147px] h-[2px] bg-out-rule"></div>

  <div class="absolute left-[53px] top-[330px] w-[1147px] flex justify-between">

    <div class="flex flex-col items-center" style="width:220px;">
      <div class="flex items-end justify-center" style="height:38px;">
        <span class="text-out-caption text-out-muted">Q1 2026</span>
      </div>
      <div class="flex items-center justify-center" style="height:24px;">
        <span class="w-[9px] h-[9px] bg-out-ink"></span>
      </div>
      <div class="flex flex-col items-center gap-[4px]" style="margin-top:14px;">
        <span class="text-out-body-sm text-out-ink font-bold">Vertical slice</span>
        <span class="text-out-caption text-out-muted text-center">Shipped to 41 testers</span>
      </div>
    </div>

    <div class="flex flex-col items-center" style="width:220px;">
      <div class="flex items-end justify-center" style="height:38px;">
        <span class="text-out-caption text-out-muted">Q3 2026</span>
      </div>
      <div class="flex items-center justify-center" style="height:24px;">
        <span class="w-[9px] h-[9px] bg-out-accent"></span>
      </div>
      <div class="flex flex-col items-center gap-[4px]" style="margin-top:14px;">
        <span class="text-out-body-sm text-out-ink font-bold">Closed beta</span>
        <span class="text-out-caption text-out-muted text-center">In build, now</span>
      </div>
    </div>

    <div class="flex flex-col items-center" style="width:220px;">
      <div class="flex items-end justify-center" style="height:38px;">
        <span class="text-out-caption text-out-muted">Q1 2027</span>
      </div>
      <div class="flex items-center justify-center" style="height:24px;">
        <span class="w-[9px] h-[9px] bg-out-rule"></span>
      </div>
      <div class="flex flex-col items-center gap-[4px]" style="margin-top:14px;">
        <span class="text-out-body-sm text-out-ink font-bold">Early access</span>
        <span class="text-out-caption text-out-muted text-center">Steam &amp; console</span>
      </div>
    </div>

    <div class="flex flex-col items-center" style="width:220px;">
      <div class="flex items-end justify-center" style="height:38px;">
        <span class="text-out-caption text-out-muted">Q4 2027</span>
      </div>
      <div class="flex items-center justify-center" style="height:24px;">
        <span class="w-[9px] h-[9px] bg-out-rule"></span>
      </div>
      <div class="flex flex-col items-center gap-[4px]" style="margin-top:14px;">
        <span class="text-out-body-sm text-out-ink font-bold">1.0 launch</span>
        <span class="text-out-caption text-out-muted text-center">PC &amp; Switch</span>
      </div>
    </div>

  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[16px] text-out-muted font-out">
    <span>Confidential</span>
    <span class="font-bold text-out-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1280×720 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1280, window.innerHeight/720);
      s.style.width='1280px';
      s.style.height='720px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
