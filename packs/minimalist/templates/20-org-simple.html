<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Slide Deck System (Outline) Slide</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'out-primary': '#201e1d',
        'out-primary-mid': '#605d5d',
        'out-accent': '#ae1800',
        'out-deep': '#2d2b2b',
        'out-support-1': '#7d7979',
        'out-support-2': '#9b9797',
        'out-ink': '#201e1d',
        'out-body': '#444141',
        'out-muted': '#605d5d',
        'out-muted-soft': '#7d7979',
        'out-rule': '#d7d3d3',
        'out-tint': '#f8f4f4',
        'out-surface': '#eae9e9',
        'out-white': '#ffffff',
        'out-neutral-400': '#bab6b6',
        'out-accent-600': '#dd2b0f',
      },

      fontFamily: {
        out: ["Archivo", "system-ui", "-apple-system", "sans-serif"],
      },

      fontSize: {
        'out-display': ['72px', { lineHeight: '1.1', fontWeight: '700' }],
        'out-section': ['64px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-title': ['56px', { lineHeight: '1.15', fontWeight: '700' }],
        'out-h2': ['40px', { lineHeight: '1.2', fontWeight: '700' }],
        'out-h3': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-metric': ['56px', { lineHeight: '1.0', fontWeight: '700' }],
        'out-lead': ['20px', { lineHeight: '1.6', fontWeight: '400' }],
        'out-subhead': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
        'out-body-sm': ['15px', { lineHeight: '1.55', fontWeight: '400' }],
        'out-label': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-eyebrow': ['12px', { lineHeight: '1.4', fontWeight: '400' }],
        'out-caption': ['14px', { lineHeight: '1.4', fontWeight: '400' }],
      },

      letterSpacing: {
        'out-eyebrow': '0.08em',
        'out-label': '0.08em',
      },

      borderRadius: {
        'out-sm': '0px',
        'out-md': '0px',
        'out-lg': '0px',
      },
    },
  },
};
</script>

<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  #slide {
    width:1280px; height:720px; position:relative; overflow:hidden; font-family:Archivo, system-ui, -apple-system, sans-serif;
    flex-shrink:0;
  }
  /* transform-origin defaults to center — correct for flex centering on html/body */
  .gradient-text {
    background:linear-gradient(60deg, #201e1d 0%, #201e1d 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
</style>
</head>
<body>

<!-- Structure carried by thin rule lines and text weight only — no bordered boxes, no colour.
     Every wrapper below is centred by symmetric left/width around the target x (340 / 640 / 940,
     640 = canvas centre so the middle child aligns exactly under the parent), and every line's
     top/height is computed from the text block above it rather than guessed. -->
<div id="slide" data-template="20-org-simple" class="bg-out-white">

  <div class="absolute left-[53px] top-[40px] text-out-eyebrow text-out-muted uppercase tracking-out-eyebrow">06 — Topic name</div>
  <h2 class="absolute left-[53px] top-[83px] text-out-h2 text-out-ink">Eight people, three disciplines</h2>

  <div class="absolute text-center" style="left:390px; top:250px; width:500px; white-space:nowrap;">
    <span class="text-out-subhead text-out-ink">Founder &amp; Creative Director</span>
  </div>

  <div class="absolute left-[639px] top-[281px] w-[2px] h-[30px] bg-out-rule"></div>
  <div class="absolute left-[340px] top-[311px] w-[600px] h-[2px] bg-out-rule"></div>
  <div class="absolute left-[339px] top-[313px] w-[2px] h-[30px] bg-out-rule"></div>
  <div class="absolute left-[639px] top-[313px] w-[2px] h-[30px] bg-out-rule"></div>
  <div class="absolute left-[939px] top-[313px] w-[2px] h-[30px] bg-out-rule"></div>

  <div class="absolute text-center" style="left:190px; top:346px; width:300px;">
    <div class="text-out-body-sm text-out-ink font-bold mb-1">Design lead</div>
    <div class="text-out-caption text-out-muted">2 systems designers</div>
  </div>
  <div class="absolute text-center" style="left:490px; top:346px; width:300px;">
    <div class="text-out-body-sm text-out-ink font-bold mb-1">Engineering lead</div>
    <div class="text-out-caption text-out-muted">3 engineers</div>
  </div>
  <div class="absolute text-center" style="left:790px; top:346px; width:300px;">
    <div class="text-out-body-sm text-out-ink font-bold mb-1">Art lead</div>
    <div class="text-out-caption text-out-muted">1 artist, 1 contractor</div>
  </div>

  <!-- ── END BODY ─────────────────────────────────────── -->

  <!-- ── Footer chrome — DO NOT EDIT ───────────────────────── -->
  <div class="absolute bottom-[24px] right-[80px] flex items-center gap-6
              text-[16px] text-out-muted font-out">
    <span>Confidential</span>
    <span class="font-bold text-out-muted" id="page-number">1</span>
  </div>

</div>

<!-- ── Canvas scaler — keeps 1280×720 at any viewport size ── -->
<script>
  (function(){ const s=document.getElementById('slide');
    function fit(){
      const r=Math.min(window.innerWidth/1280, window.innerHeight/720);
      s.style.width='1280px';
      s.style.height='720px';
      s.style.transformOrigin='center center';
      s.style.transform='scale('+r+')';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }
    fit(); window.addEventListener('resize',fit); })();
</script>

</body>
</html>
