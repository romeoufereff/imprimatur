<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline runs fixture</title>
<!-- pptx-export regression fixture (1.6.5), graded by `run_evals.py export`. A styled run
     inside a word must not get a space injected before it, <sup>/<sub> are baseline-offset
     runs on the same line (not a new paragraph), and real spaces, soft wraps and <br> are
     kept. Brand-neutral; mirrors the product wordmark of the 2026-10-23 exec briefing. -->
<style>
  html, body { margin: 0; }
  #slide { position: relative; width: 1920px; height: 1080px; background: rgb(255, 255, 255);
           font-family: Arial, Helvetica, sans-serif; color: rgb(34, 34, 34); }
  .wordmark { position: absolute; left: 120px; top: 100px; font-size: 50px; font-weight: 700;
              letter-spacing: -0.02em; }
  .wordmark .accent { color: rgb(48, 85, 218); }
  .wordmark sup { font-size: 28px; font-weight: 300; color: rgb(106, 106, 106); vertical-align: super; }
  .spaced { position: absolute; left: 120px; top: 220px; font-size: 32px; }
  .spaced .accent { color: rgb(48, 85, 218); font-weight: 700; }
  .formula { position: absolute; left: 120px; top: 320px; font-size: 32px; }
  .mixed { position: absolute; left: 120px; top: 420px; font-size: 28px; }
  .mixed .big { font-size: 44px; font-weight: 700; }
  .wrapped { position: absolute; left: 120px; top: 540px; width: 520px; font-size: 28px; line-height: 1.3; }
  .broken { position: absolute; left: 900px; top: 540px; font-size: 28px; }
</style>
</head>
<body>
<div id="slide" data-template="fixture">
  <div class="wordmark" data-case="wordmark">mig<span class="accent">V</span>isor<sup>™</sup></div>
  <p class="spaced" data-case="spaced">Brownfield <span class="accent">intake</span> stays editable</p>
  <p class="formula" data-case="formula">H<sub>2</sub>O and E = mc<sup>2</sup></p>
  <p class="mixed" data-case="mixed">One <span class="big">larger</span> word on one line</p>
  <p class="wrapped" data-case="wrapped">A long sentence that the browser wraps onto more than one line inside its narrow box</p>
  <p class="broken" data-case="broken">Before the break<br>after the break</p>
</div>
</body>
</html>
